name: jejom
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.0.2
  firebase_core: ^4.2.0
  flutter_dotenv: ^6.0.0
  flutter_staggered_animations: ^1.1.1
  flutter_swipe_button: ^2.1.3
  google_fonts: ^6.3.2
  intl: ^0.20.2
  image_picker: ^1.2.0
  google_maps_flutter: 2.13.1
  location: ^8.0.1
  provider: ^6.1.5+1
  widget_circular_animator: ^1.0.0
  crystal_navigation_bar: ^1.0.4
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  http: ^1.5.0
  flutter_launcher_icons: ^0.14.4
  geocoding: ^4.0.0
  firebase_storage: ^13.0.3
  geolocator: ^14.0.2
  numberpicker: ^2.1.2
  flutter_rating: ^2.0.2
  easy_date_timeline: ^2.0.9
  sticky_headers: ^0.3.0+2
  story_view: ^0.16.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/jejomLogo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/jejomLogo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/jejomLogo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/jejomLogo.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
    - assets/images/
    - assets/balloon_fireworks.json

  # Add font configuration for Akzidenz-Grotesk
  fonts:
    - family: Akzidenz-Grotesk
      fonts:
        - asset: assets/akzidenz-grotesk/Akzidenz-grotesk-roman.ttf
          weight: 400
        - asset: assets/akzidenz-grotesk/Akzidenz-grotesk-bold.ttf
          weight: 700
        - asset: assets/akzidenz-grotesk/Akzidenz-grotesk-black.ttf
          weight: 900
        - asset: assets/akzidenz-grotesk/Akzidenz-grotesk-light.ttf
          weight: 300
        - asset: assets/akzidenz-grotesk/verthold-akzidenz-grotesk-be-italic.ttf
          style: italic
